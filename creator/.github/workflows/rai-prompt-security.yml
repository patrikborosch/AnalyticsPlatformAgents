# RAI Prompt Security Scanner
# Scans skill prompts for dangerous patterns and injection vulnerabilities

name: RAI Prompt Security

on:
  pull_request:
    branches: [main, bocrivat_main]
    paths:
      - 'skills/**'
      - 'common/**'
  push:
    branches: [main, bocrivat_main]
    paths:
      - 'skills/**'
      - 'common/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  prompt-lint:
    name: Scan for Prompt Injection Patterns
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
      
      - name: Run prompt security scanner
        run: |
          python .github/scripts/scan_prompt_security.py --path skills/ --strict
      
      - name: Comment results on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ **Prompt Security Scan Failed**\n\nDangerous patterns detected in skill prompts. Please review the workflow logs for details.'
            })
