  # -- spark-authoring-mlv-create --
  # New: covers "materialized lake view", "MLV", "CREATE MATERIALIZED LAKE VIEW" triggers
  # Author: sairamyeturi
  # NOTE: Execution-mode prompt — agent must actually create the MLV in {{WORKSPACE}}.
  # Uses the `nyctlc` table seeded by setup_test_env.py in the default dbo schema.
  - name: "MLV -- create a Materialized Lake View with Spark SQL"
    prompt: |
      In the {{WORKSPACE}} workspace, create a materialized lake view named
      dbo.nyc_trips_clean in my Fabric lakehouse. The MLV should read from
      the existing dbo.nyctlc table, select VendorID, lpep_pickup_datetime,
      fare_amount, and total_amount, and add a data quality constraint that
      drops rows where fare_amount is null or not positive. Use CREATE OR
      REPLACE so the script is safe to re-run. Only use the specified
      workspace. If not found, report an error. Do NOT search or use any
      other workspace.
    tags:
      type: integration
      tier: smoke
      cost: llm
      area: spark
    constraints:
      max_turns: 15
      max_tokens: 150000
      max_duration: 5m
      reject_skills:
        - spark-consumption-cli
        - spark-operations-cli
    graders:
      # ----------------------------------------------------------------
      # Layer 0 -- baseline narrative / metric checks
      # ----------------------------------------------------------------
      - type: skill-invocation
        config:
          required:
            - spark-authoring-cli
          disallowed:
            - spark-consumption-cli
            - spark-operations-cli
      - type: completed

      # ----------------------------------------------------------------
      # Layer 1 -- tool-calls assertions. Grounded in real trajectory
      # from live Fabric workspace MLV_At_Scale (2026-06-16).
      # Proves the agent ATTEMPTED the right Fabric REST + Livy operations.
      # ----------------------------------------------------------------
      - type: tool-calls
        name: tool-calls-mlv-create
        config:
          required:
            # Workspace discovery via Fabric REST
            - name: &shell_tool '(?i)^(bash|powershell|shell|run_in_terminal|functions\.bash|functions\.powershell)$'
              command: '(?is)\baz\s+rest\b(?:.*?--method\s+get\b.*?/v1/workspaces\b|.*?/v1/workspaces\b.*?--method\s+get\b)'
            # Lakehouse discovery
            - name: *shell_tool
              command: '(?is)\baz\s+rest\b(?:.*?--method\s+get\b.*?/lakehouses\b|.*?/lakehouses\b.*?--method\s+get\b)'
            # Livy session creation (POST to livyApi sessions endpoint)
            - name: *shell_tool
              command: '(?is)\baz\s+rest\b(?:.*?--method\s+post\b.*?/livyApi/.*?/sessions\b|.*?/livyApi/.*?/sessions\b.*?--method\s+post\b)'
            # Spark SQL statement submission (POST to statements endpoint)
            - name: *shell_tool
              command: '(?is)\baz\s+rest\b(?:.*?--method\s+post\b.*?/statements\b|.*?/statements\b.*?--method\s+post\b)'
          disallowed:
            # Must not DELETE or PUT on workspace/lakehouse items
            - name: *shell_tool
              command: '(?is)\baz\s+rest\b.*?--method\s+(delete|put)\b.*?/(workspaces|lakehouses)/[^/\s]+'
            # Must not use Fabric /v2/ (no public v2 surface today)
            - name: *shell_tool
              command: '(?is)https://api\.fabric\.microsoft\.com/v2/'

      # ----------------------------------------------------------------
      # Layer 2 -- live-Fabric program verifier. Creates a Livy session
      # and runs SHOW MATERIALIZED LAKE VIEWS + SHOW CREATE to assert the
      # MLV exists with the correct CONSTRAINT/CHECK/ON MISMATCH shape.
      # ----------------------------------------------------------------
      - type: program
        name: verify-mlv-create
        config:
          program: pwsh
          args:
            - -NoProfile
            - -ExecutionPolicy
            - Bypass
            - -File
            - tests/evals/_graders/spark-authoring-cli/verify-mlv-create.ps1
          timeout: 300s
          env:
            FABRIC_WORKSPACE_ID: "{{WORKSPACE_ID}}"
            MLV_EXPECTED_NAME: "nyc_trips_clean"
            MLV_EXPECTED_SCHEMA: "dbo"
            VALLY_GRADER_POLL_DEADLINE_SECONDS: "120"
            VALLY_GRADER_POLL_INTERVAL_SECONDS: "5"

      # ----------------------------------------------------------------
      # Layer 0 (narrative) -- output-string checks
      # ----------------------------------------------------------------
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"
      - type: output-matches
        config:
          pattern: "(?i)CREATE\\s+(OR\\s+REPLACE\\s+)?MATERIALIZED\\s+LAKE\\s+VIEW"
      - type: output-contains
        config:
          substring: "nyc_trips_clean"
      - type: output-matches
        config:
          # DOTALL + non-greedy bridge — tolerates multi-line SQL formatting
          pattern: "(?is)CONSTRAINT\\b[\\s\\S]{0,120}?CHECK\\b"
      - type: output-matches
        config:
          pattern: "(?i)ON\\s+MISMATCH\\s+(DROP|FAIL)"

      # ----------------------------------------------------------------
      # Budget kill-switches
      # ----------------------------------------------------------------
      - type: token-budget
        config:
          max: 150000
      - type: error-count
        config:
          max: 0
      - type: wall-time
        config:
          max: "5m"
      - type: turn-count
        config:
          max: 15
      - type: tool-call-count
        config:
          max: 25
      - type: turn-count
        config:
          max: 10
      - type: tool-call-count
        config:
          max: 15

  # -- spark-authoring-mlv-incremental-refresh --
  # New: covers "materialized lake view incremental refresh" trigger
  # Author: sairamyeturi
  - name: "MLV -- review query for incremental refresh readiness"
    l1l2_exempt: "Offline incremental-refresh-readiness review: agent analyzes provided SQL text and returns advice; nothing is created in Fabric to verify (no tool call, no artefact)."
    prompt: |
      I have a materialized lake view in my Fabric lakehouse that uses DISTINCT and a window function ROW_NUMBER(). Review whether this materialized lake view query supports incremental refresh and suggest how to rewrite it for optimal refresh.
    tags:
      type: integration
      tier: smoke
      cost: llm
      area: spark
    constraints:
      max_turns: 10
      max_tokens: 150000
      max_duration: 3m
      reject_skills:
        - spark-consumption-cli
        - spark-operations-cli
    graders:
      # ----------------------------------------------------------------
      # Layer 0 -- baseline narrative / metric checks
      # ----------------------------------------------------------------
      - type: skill-invocation
        config:
          required:
            - spark-authoring-cli
          disallowed:
            - spark-consumption-cli
            - spark-operations-cli
      - type: completed
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"
      - type: output-matches
        config:
          pattern: "(?i)(incremental|full|optimal)[-\\s]+refresh"
      - type: output-matches
        config:
          pattern: "(?i)(window\\s+function|ROW_NUMBER|DISTINCT)"
      - type: output-not-matches
        config:
          # Catches affirmatively-wrong verdicts only
          pattern: "(?i)\\b(is|will\\s+be)\\s+(fully\\s+)?(incremental[-\\s]refresh[-\\s]safe|incrementally\\s+refreshable|incremental[-\\s]refresh[-\\s]+ready|incremental[-\\s]refresh[-\\s]+eligible)\\b"

      # ----------------------------------------------------------------
      # Budget kill-switches
      # ----------------------------------------------------------------
      - type: token-budget
        config:
          max: 150000
      - type: error-count
        config:
          max: 0
      - type: wall-time
        config:
          max: "3m"
      - type: turn-count
        config:
          max: 10
      - type: tool-call-count
        config:
          max: 25
