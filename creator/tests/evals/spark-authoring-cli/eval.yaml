# Vally eval config -- migrated from tests/tests.json (skills-for-fabric)
# Source stimuli: spark-authoring-notebook-sanity, spark-authoring-notebook-code-lakehouse, spark-authoring-notebook-code-notebookutils, spark-authoring-notebook-code-configure, spark-authoring-notebook-code-sql-crosslh, spark-authoring-notebook-code-resource-files, spark-authoring-notebook-code-runtime-context, spark-authoring-notebook-code-connection, spark-authoring-notebook-code-dag, spark-authoring-mlv-create, spark-authoring-mlv-incremental-refresh
#
# Known gap: prompts contain {{WORKSPACE}} placeholder substituted at runtime by
# tests/run-vally-eval.ps1. See tests/evals/README.md for local-run instructions.

name: spark-authoring-cli-integration-eval
description: |
  Integration evaluation for spark-authoring-cli -- verifies notebook execution sanity plus 8 notebook-code generation prompts (lakehouse IO, notebookutils, %%configure, %%sql cross-lakehouse, builtin resource files, runtime context, connections, multi-notebook DAG) and 2 Materialized Lake View prompts (CREATE MLV, incremental refresh readiness).

