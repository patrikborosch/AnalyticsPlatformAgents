# Vally eval config -- pilot migration from tests/tests.json (skills-for-fabric)
# Source stimulus: tests/tests.json entry "spark-consumption-livy-sanity"
#
# Global graders (evaluate#125 workaround): completed + output-not-matches
# are duplicated into every stimulus block below (per-stimulus pattern).
#
# Known gap: prompts contain {{WORKSPACE}} placeholder substituted at runtime by
# tests/testFabricSkills.ps1. Vally has no built-in substitution today; real
# outer-loop runs need a substituted copy. See inbox/vally-grader-pilot-2026-05-13.md.

name: spark-consumption-cli-integration-eval
description: |
  Integration evaluation for spark-consumption-cli -- pilot migration of the
  spark-consumption-livy-sanity smoke stimulus into the migrated Vally eval.yaml shape
  (skill-invocation + completed + output-not-matches + output-contains for
  expectedResults parity with tests/testFabricSkills.ps1).

tags:
  type: integration
  skill: spark-consumption-cli

environment:
  skills:
    - ../../../skills/spark-consumption-cli

config:
  runs: 5
  timeout: "15m"
  executor: copilot-sdk
  model: claude-sonnet-4.6

scoring:
  threshold: 1.0

stimuli:
  # -- spark-consumption-livy-sanity --
  # Source: tests/tests.json (area=spark)
  - name: "Livy session sanity calculation"
    prompt: |
      In Fabric, i have a lakehouse in the {{WORKSPACE}} workspace - named
      LSEGDemo. Create a Livy session and run a simple calculation: 123+589.
      Only use the specified workspace. If not found, report an error.
      Do NOT search or use any other workspace.
    tags:
      type: integration
      tier: smoke
      cost: llm
      area: spark
    # Per-stimulus constraints (in-flight kill-switch, tier=smoke)
    constraints:
      max_turns: 35
      max_tokens: 1500000
      max_duration: 10m
    graders:
      - type: skill-invocation
        config:
          required:
            - spark-consumption-cli
      # Global: has_output
      - type: completed
      # Global: no_runtime_failure
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"
      # expectedResults parity with smoke (123 + 589 = 712)
      - type: output-contains
        config:
          substring: "712"
      - type: token-budget
        config:
          max: 1500000
      - type: error-count
        config:
          max: 0
      - type: wall-time
        config:
          max: "10m"
      - type: turn-count
        config:
          max: 35
      - type: tool-call-count
        config:
          max: 50
