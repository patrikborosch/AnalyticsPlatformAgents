# Vally eval config -- migrated from tests/tests.json (skills-for-fabric)
# Source stimulus: powerbi-report-planning-basic
# Pattern reference: microsoft/GitHub-Copilot-for-Azure#2235
#
# Layer 0 baseline coverage authored by the cutover PR; workload-team owner
# should evolve toward Layer 1 (tool-calls) + Layer 2 (program verifier)
# using the eventhouse-authoring-cli pilot in PR #282 as the worked example.
# See tests/evals/README.md for the L0 template + L1+L2 walkthrough.

name: powerbi-report-planning-integration-eval
description: |
  Integration evaluation for powerbi-report-planning. Migrated from
  tests/tests.json::powerbi-report-planning-basic as Layer 0 only; the
  workload-team owner should add Layer 1+2 deterministic graders
  in a follow-up PR.

tags:
  type: integration
  skill: powerbi-report-planning

environment:
  skills:
    - ../../../skills/powerbi-report-planning
  mcpServers:
    powerbi-modeling-mcp:
      type: stdio
      command: npx
      args:
        - "-y"
        - "@microsoft/powerbi-modeling-mcp@latest"
        - "--start"
      timeout: 2m

config:
  runs: 5
  timeout: "15m"
  executor: copilot-sdk
  model: claude-sonnet-4.6

scoring:
  threshold: 1.0

stimuli:
  # -- powerbi-report-planning-basic --
  # Source: tests/tests.json (area=powerbi)
  # TODO(<team>): calibrate constraints over first 1-2 weeks; pilot defaults inherited from eventhouse-authoring-cli
  - name: "Plan a Power BI executive sales report"
    prompt: |
      Plan a Power BI executive sales report for the semantic model nyctaxi_yellow_directlake in the {{WORKSPACE}} workspace. Do not edit files yet; produce the report requirements, page plan, dependencies, and approval gate.
    tags:
      type: integration
      tier: smoke
      cost: llm
      area: powerbi
    constraints:
      max_turns: 35
      max_tokens: 1500000
      max_duration: 10m
      reject_skills:
        - powerbi-report-design
        - powerbi-report-authoring
        - powerbi-report-management
    graders:
      - type: skill-invocation
        config:
          required:
            - powerbi-report-planning
          disallowed:
            - powerbi-report-design
            - powerbi-report-authoring
            - powerbi-report-management
      - type: completed
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"
      - type: output-matches
        config:
          pattern: "(?i)\\b(plan|requirements|page)\\b"
      # expectedResults parity with smoke
      - type: output-contains
        config:
          substring: "report"
      - type: output-contains
        config:
          substring: "plan"
      - type: token-budget
        config:
          max: 1500000
      - type: error-count
        config:
          max: 0
      - type: wall-time
        config:
          max: "10m"
      - type: turn-count
        config:
          max: 35
      - type: tool-call-count
        config:
          max: 50
