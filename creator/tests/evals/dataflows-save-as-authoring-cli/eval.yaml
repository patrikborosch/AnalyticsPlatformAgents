# Vally eval config -- migrated from tests/tests.json (skills-for-fabric)
# Source stimuli: dataflows-save-as-authoring-readiness-snapshot
#
# Known gap: prompts contain {{WORKSPACE}} placeholder substituted at runtime by
# tests/run-vally-eval.ps1. See tests/evals/README.md for local-run instructions.

name: dataflows-save-as-authoring-cli-integration-eval
description: |
  Integration evaluation for dataflows-save-as-authoring-cli -- Gen1-to-Gen2 readiness snapshot generation (risk signals: incremental refresh, BYOSA, Power Automate, pipeline deps, linked entities, DirectQuery).

tags:
  type: integration
  skill: dataflows-save-as-authoring-cli

environment:
  skills:
    - ../../../skills/dataflows-save-as-authoring-cli

config:
  runs: 5
  timeout: "15m"
  executor: copilot-sdk
  model: claude-sonnet-4.6

scoring:
  threshold: 1.0

stimuli:
  # -- dataflows-save-as-authoring-readiness-snapshot --
  # Source: tests/tests.json (area=dataflows)
  - name: "Produce Gen1-to-Gen2 migration readiness snapshot"
    prompt: |
      In the {{WORKSPACE}} workspace, use the dataflows save-as authoring flow to assess Gen1 to Gen2 CI/CD readiness and produce a Migration Readiness Snapshot in markdown and JSON. Include risk signal checks (incremental refresh, BYOSA storage, Power Automate triggers, pipeline dependencies, linked entities, DirectQuery), but do not execute migration or refresh. Only use the specified workspace. If not found, report an error. Do NOT search or use any other workspace.
    tags:
      type: integration
      tier: smoke
      cost: llm
      area: dataflows
    # Per-stimulus constraints (in-flight kill-switch, tier=smoke)
    constraints:
      max_turns: 35
      max_tokens: 1500000
      max_duration: 10m
      reject_skills:
        - dataflows-authoring-cli
        - dataflows-consumption-cli
    graders:
      - type: skill-invocation
        config:
          required:
            - dataflows-save-as-authoring-cli
          disallowed:
            - dataflows-authoring-cli
            - dataflows-consumption-cli
      - type: completed
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"
      - type: output-contains
        config:
          substring: "Migration Readiness Snapshot"
      - type: output-contains
        config:
          substring: "readiness"
      - type: output-contains
        config:
          substring: "risk"
      - type: token-budget
        config:
          max: 1500000
      - type: error-count
        config:
          max: 0
      - type: wall-time
        config:
          max: "10m"
      - type: turn-count
        config:
          max: 35
      - type: tool-call-count
        config:
          max: 50
