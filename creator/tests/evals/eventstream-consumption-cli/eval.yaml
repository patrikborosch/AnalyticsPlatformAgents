# Vally eval config -- migrated from tests/tests.json (skills-for-fabric)
# Source stimuli: eventstream-consumption-list, eventstream-consumption-inspect,
#   eventstream-consumption-health
#
# Known gap: prompts contain {{WORKSPACE}} placeholder substituted at runtime by
# tests/run-vally-eval.ps1. See tests/evals/README.md for local-run instructions.
#
# NOTE: These stimuli have no expectedResults in tests.json. Grading relies on
# skill-invocation routing + completed. Output content is not validated.

name: eventstream-consumption-cli-integration-eval
description: |
  Integration evaluation for eventstream-consumption-cli -- verifies listing,
  inspecting topology, and checking health of Eventstreams with correct routing.

tags:
  type: integration
  skill: eventstream-consumption-cli

environment:
  skills:
    - ../../../skills/eventstream-consumption-cli

config:
  runs: 5
  timeout: "15m"
  executor: copilot-sdk
  model: claude-sonnet-4.6

scoring:
  threshold: 1.0

stimuli:
  # -- eventstream-consumption-list --
  - name: "List Eventstreams in workspace"
    prompt: |
      List all Eventstreams in my {{WORKSPACE}} workspace. Only use the
      specified workspace. If not found, report an error. Do NOT search or use
      any other workspace.
    tags:
      type: integration
      tier: smoke
      cost: llm
      area: eventstream
    # Per-stimulus constraints (in-flight kill-switch, tier=smoke)
    constraints:
      max_turns: 35
      max_tokens: 1500000
      max_duration: 10m
      reject_skills:
        - eventstream-authoring-cli
        - eventhouse-consumption-cli
    # TODO(workload-team): backfill a deterministic positive output
    # assertion (output-matches or output-contains on a tool-trace
    # token, NOT on narrative prose). See tests/evals/README.md.
    l0_exempt:
      - positive-output-assertion
    graders:
      - type: skill-invocation
        config:
          required:
            - eventstream-consumption-cli
          disallowed:
            - eventstream-authoring-cli
            - eventhouse-consumption-cli
      - type: completed
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"
      - type: token-budget
        config:
          max: 1500000
      - type: error-count
        config:
          max: 0
      - type: wall-time
        config:
          max: "10m"
      - type: turn-count
        config:
          max: 35
      - type: tool-call-count
        config:
          max: 50

  # -- eventstream-consumption-inspect --
  - name: "Inspect Eventstream topology"
    prompt: |
      Inspect the topology of my sensor-pipeline Eventstream and show me all
      sources and destinations in my {{WORKSPACE}} workspace. Only use the
      specified workspace. If not found, report an error. Do NOT search or use
      any other workspace.
    tags:
      type: integration
      tier: smoke
      cost: llm
      area: eventstream
    # Per-stimulus constraints (in-flight kill-switch, tier=smoke)
    constraints:
      max_turns: 35
      max_tokens: 1500000
      max_duration: 10m
    # TODO(workload-team): backfill a deterministic positive output
    # assertion (output-matches or output-contains on a tool-trace
    # token, NOT on narrative prose). See tests/evals/README.md.
    l0_exempt:
      - positive-output-assertion
    graders:
      - type: skill-invocation
        config:
          required:
            - eventstream-consumption-cli
      - type: completed
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"
      - type: token-budget
        config:
          max: 1500000
      - type: error-count
        config:
          max: 0
      - type: wall-time
        config:
          max: "10m"
      - type: turn-count
        config:
          max: 35
      - type: tool-call-count
        config:
          max: 50

  # -- eventstream-consumption-health --
  - name: "Check Eventstream retention and throughput"
    prompt: |
      Check the retention and throughput settings for my sensor-pipeline
      Eventstream in my {{WORKSPACE}} workspace. Only use the specified
      workspace. If not found, report an error. Do NOT search or use any other
      workspace.
    tags:
      type: integration
      tier: smoke
      cost: llm
      area: eventstream
    # Per-stimulus constraints (in-flight kill-switch, tier=smoke)
    constraints:
      max_turns: 35
      max_tokens: 1500000
      max_duration: 10m
    # TODO(workload-team): backfill a deterministic positive output
    # assertion (output-matches or output-contains on a tool-trace
    # token, NOT on narrative prose). See tests/evals/README.md.
    l0_exempt:
      - positive-output-assertion
    graders:
      - type: skill-invocation
        config:
          required:
            - eventstream-consumption-cli
      - type: completed
      - type: output-not-matches
        config:
          pattern: "(?i)fatal error|unhandled exception|stack trace"
      - type: token-budget
        config:
          max: 1500000
      - type: error-count
        config:
          max: 0
      - type: wall-time
        config:
          max: "10m"
      - type: turn-count
        config:
          max: 35
      - type: tool-call-count
        config:
          max: 50
